<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Store - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .login-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #667eea; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px;
        }
        button:hover { background: #5a6fd8; }
        .message { margin-top: 15px; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .demo-users { margin-top: 20px; font-size: 12px; }
        .demo-users h3 { margin-bottom: 10px; }
        .demo-user { 
            background: #f8f9fa; 
            padding: 5px; 
            margin: 5px 0; 
            border-radius: 3px; 
            cursor: pointer;
        }
        .demo-user:hover { background: #e9ecef; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🐾 Pet Store Login</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit">Login</button>
        </form>
        
        <div id="message"></div>
        
        <div class="demo-users">
            <h3>Demo Users (Click to auto-fill):</h3>
            <div class="demo-user" onclick="fillLogin('madisonscott50', 'password123')">
                madisonscott50 - Madison Scott (Fluffy & Rex)
            </div>
            <div class="demo-user" onclick="fillLogin('mikejoh27', 'password123')">
                mikejoh27 - Mike Johnson (Fluffy & Rex)
            </div>
            <div class="demo-user" onclick="fillLogin('testuse52', 'password123')">
                testuse52 - Test User 1 (Fluffy & Rex)
            </div>
            <div class="demo-user" onclick="fillLogin('customer123', 'password123')">
                customer123 - Customer123
            </div>
            <div class="demo-user" onclick="fillLogin('demo123', 'password123')">
                demo123 - Demo123
            </div>
        </div>
    </div>

    <script>
        // Demo user database (subset for quick login)
        const demoUsers = {
            'madisonscott50': {
                username: 'madisonscott50',
                name: 'Madison Scott',
                full_name: 'Madison Scott',
                email: 'madison.scott@email.com',
                pets: [
                    { name: 'Fluffy', species: 'Cat', breed: 'Persian', age: 3 },
                    { name: 'Rex', species: 'Dog', breed: 'German Shepherd', age: 5 }
                ]
            },
            'mikejoh27': {
                username: 'mikejoh27',
                name: 'Mike Johnson',
                full_name: 'Mike Johnson',
                email: 'mike.johnson@email.com',
                pets: [
                    { name: 'Fluffy', species: 'Cat', breed: 'Tabby', age: 2 },
                    { name: 'Rex', species: 'Dog', breed: 'Labrador', age: 4 }
                ]
            },
            'testuse52': {
                username: 'testuse52',
                name: 'Test User 1',
                full_name: 'Test User 1',
                email: 'test@email.com',
                pets: [
                    { name: 'Fluffy', species: 'Cat', breed: 'Mixed', age: 1 },
                    { name: 'Rex', species: 'Dog', breed: 'Mixed', age: 3 }
                ]
            },
            'customer123': {
                username: 'customer123',
                name: 'Customer123',
                full_name: 'Customer 123',
                email: 'customer@email.com',
                pets: []
            },
            'demo123': {
                username: 'demo123',
                name: 'Demo123',
                full_name: 'Demo User',
                email: 'demo@email.com',
                pets: []
            }
        };

        function fillLogin(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            console.log('🔐 Login attempt:', username);
            
            // Simple validation (in production, this would be server-side)
            if (password === 'password123' && demoUsers[username]) {
                const userData = demoUsers[username];
                
                // Store user data in localStorage
                localStorage.setItem('userData', JSON.stringify(userData));
                console.log('✅ User data stored:', userData);
                
                showMessage('Login successful! Redirecting...', 'success');
                
                // Redirect to customer portal
                setTimeout(() => {
                    window.location.href = 'customer.html';
                }, 1500);
                
            } else {
                showMessage('Invalid username or password. Try a demo user above.', 'error');
            }
        });

        console.log('🔐 Working Auth System Loaded');
        console.log('Available demo users:', Object.keys(demoUsers));
    </script>
</body>
</html>
