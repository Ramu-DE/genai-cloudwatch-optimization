AWSTemplateFormatVersion: '2010-09-09'
Description: WealthAI Copilot - Wealth Management GenAI Platform with CloudWatch Observability

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0

Resources:

  # ============================================================
  # DynamoDB Tables
  # ============================================================
  ClientProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wealth_mgmt_client_profiles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: client_id
          AttributeType: S
      KeySchema:
        - AttributeName: client_id
          KeyType: HASH

  PortfoliosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wealth_mgmt_portfolios
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: client_id
          AttributeType: S
        - AttributeName: portfolio_id
          AttributeType: S
      KeySchema:
        - AttributeName: client_id
          KeyType: HASH
        - AttributeName: portfolio_id
          KeyType: RANGE

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wealth_mgmt_transactions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: client_id
          AttributeType: S
        - AttributeName: transaction_id
          AttributeType: S
      KeySchema:
        - AttributeName: client_id
          KeyType: HASH
        - AttributeName: transaction_id
          KeyType: RANGE

  ConsultationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wealth_mgmt_consultations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: client_id
          AttributeType: S
        - AttributeName: consultation_id
          AttributeType: S
      KeySchema:
        - AttributeName: client_id
          KeyType: HASH
        - AttributeName: consultation_id
          KeyType: RANGE

  AdvisorScheduleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wealth_mgmt_advisor_schedule
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: advisor_id
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: advisor_id
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE

  TaxRecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wealth_mgmt_tax_records
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: client_id
          AttributeType: S
        - AttributeName: tax_year
          AttributeType: S
      KeySchema:
        - AttributeName: client_id
          KeyType: HASH
        - AttributeName: tax_year
          KeyType: RANGE

  ComplianceRecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wealth_mgmt_compliance_records
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: client_id
          AttributeType: S
        - AttributeName: record_id
          AttributeType: S
      KeySchema:
        - AttributeName: client_id
          KeyType: HASH
        - AttributeName: record_id
          KeyType: RANGE

  AuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wealth_mgmt_audit_log
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: client_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: client_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  UserAuthTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wealth_mgmt_user_auth
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
        - AttributeName: session_token
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: session_token-index
          KeySchema:
            - AttributeName: session_token
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  WebSocketConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wealth_mgmt_websocket_connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl

  MarketDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wealth_mgmt_market_data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticker
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: ticker
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE

  LoadTestResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wealth_mgmt_load_test_results
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: test_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: test_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  # ============================================================
  # IAM Roles
  # ============================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: wealth_mgmt_lambda_role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: wealth_mgmt_lambda_policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/wealth_mgmt_*'
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                Resource: '*'
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: 'WealthMgmt/Agents'
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: 'WealthMgmt/LoadTest'

  BedrockInvocationLoggingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: wealth_mgmt_bedrock_logging_role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: bedrock_logging_policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock/*'

  # ============================================================
  # Lambda Functions
  # ============================================================
  AgentRouterLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: wealth_mgmt_agent_router_lambda
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 256
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          REGION: !Ref AWS::Region
          USER_AUTH_TABLE: !Ref UserAuthTable
          MARCUS_AGENT_ARN: !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/wealth_mgmt_marcus_market_analyst'
          SOPHIA_AGENT_ARN: !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/wealth_mgmt_sophia_financial_planner'
          OLIVIA_AGENT_ARN: !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/wealth_mgmt_olivia_tax_optimizer'
          VICTOR_AGENT_ARN: !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/wealth_mgmt_victor_compliance_checker'

  AuthLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: wealth_mgmt_auth_lambda
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 15
      MemorySize: 128
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          REGION: !Ref AWS::Region
          USER_AUTH_TABLE: !Ref UserAuthTable
          CLIENT_PROFILES_TABLE: !Ref ClientProfilesTable

  WebSocketLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: wealth_mgmt_websocket_lambda
      Runtime: python3.13
      Handler: websocket_handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 256
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          REGION: !Ref AWS::Region
          CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
          MARCUS_AGENT_ARN: !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/wealth_mgmt_marcus_market_analyst'
          SOPHIA_AGENT_ARN: !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/wealth_mgmt_sophia_financial_planner'
          OLIVIA_AGENT_ARN: !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/wealth_mgmt_olivia_tax_optimizer'
          VICTOR_AGENT_ARN: !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/wealth_mgmt_victor_compliance_checker'

  LoadTesterLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: wealth_mgmt_load_tester_lambda
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 512
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          REGION: !Ref AWS::Region
          LOAD_TEST_TABLE: !Ref LoadTestResultsTable
          MARCUS_AGENT_ARN: !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/wealth_mgmt_marcus_market_analyst'
          SOPHIA_AGENT_ARN: !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/wealth_mgmt_sophia_financial_planner'
          OLIVIA_AGENT_ARN: !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/wealth_mgmt_olivia_tax_optimizer'
          VICTOR_AGENT_ARN: !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/wealth_mgmt_victor_compliance_checker'

  OptimizationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: wealth_mgmt_optimization_lambda
      Runtime: python3.13
      Handler: lambda_handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 120
      MemorySize: 512
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          REGION: !Ref AWS::Region
          SOPHIA_AGENT_ARN: !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/wealth_mgmt_sophia_financial_planner'

  # ============================================================
  # SNS Topic for Alarms
  # ============================================================
  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: wealth-mgmt-alarms
      DisplayName: WealthAI Copilot Alarms

  # ============================================================
  # REST API Gateway (with routes and integrations)
  # ============================================================
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: wealth_mgmt_api
      Description: WealthAI Copilot REST API
      EndpointConfiguration:
        Types: [REGIONAL]

  AgentResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: agent

  AgentMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref AgentResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AgentRouterLambda.Arn}/invocations'

  AgentOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref AgentResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  AuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: auth

  AuthLoginResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref AuthResource
      PathPart: login

  AuthLoginMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref AuthLoginResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthLambda.Arn}/invocations'

  LoadTestResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: loadtest

  LoadTestMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref LoadTestResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoadTesterLambda.Arn}/invocations'

  OptimizationResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: optimization

  OptimizationMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref OptimizationResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OptimizationLambda.Arn}/invocations'

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - AgentMethod
      - AuthLoginMethod
      - LoadTestMethod
      - OptimizationMethod
    Properties:
      RestApiId: !Ref RestApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod
      TracingEnabled: true
      MethodSettings:
        - HttpMethod: '*'
          ResourcePath: '/*'
          DataTraceEnabled: true
          LoggingLevel: INFO
          MetricsEnabled: true

  # Lambda Permissions for API Gateway
  AgentRouterLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgentRouterLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*'

  AuthLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*'

  LoadTesterLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LoadTesterLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*'

  OptimizationLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OptimizationLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*'

  # ============================================================
  # WebSocket API Gateway (with routes)
  # ============================================================
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: wealth_mgmt_websocket_api
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  WebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WebSocketIntegration}'

  WebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub 'integrations/${WebSocketIntegration}'

  WebSocketDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Sub 'integrations/${WebSocketIntegration}'

  WebSocketSendMessageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: sendMessage
      Target: !Sub 'integrations/${WebSocketIntegration}'

  WebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketLambda.Arn}/invocations'

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: prod
      AutoDeploy: true

  WebSocketLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebSocketLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

  # ============================================================
  # S3 + CloudFront for Frontend
  # ============================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'wealth-mgmt-frontend-${AWS::AccountId}'
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'wealth-mgmt-oac-${AWS::AccountId}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: WealthAI Copilot Frontend
        DefaultRootObject: index.html
        Enabled: true
        Origins:
          - DomainName: !GetAtt FrontendBucket.RegionalDomainName
            Id: S3Origin
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: false

  # ============================================================
  # ECR Repositories
  # ============================================================
  MarcusECR:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: wealth-mgmt-market-analyst

  SophiaECR:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: wealth-mgmt-financial-planner

  OliviaECR:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: wealth-mgmt-tax-optimizer

  VictorECR:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: wealth-mgmt-compliance-checker

  # ============================================================
  # CloudWatch Log Groups
  # ============================================================
  BedrockInvocationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/bedrock/wealth_mgmt/modelinvocations
      RetentionInDays: 30

  AgentRouterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/wealth_mgmt_agent_router_lambda
      RetentionInDays: 14

  AuthLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/wealth_mgmt_auth_lambda
      RetentionInDays: 14

  MarcusAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/bedrock-agentcore/runtimes/wealth_mgmt_marcus_market_analyst
      RetentionInDays: 30

  SophiaAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/bedrock-agentcore/runtimes/wealth_mgmt_sophia_financial_planner
      RetentionInDays: 30

  OliviaAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/bedrock-agentcore/runtimes/wealth_mgmt_olivia_tax_optimizer
      RetentionInDays: 30

  ComplianceCheckerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/wealth_mgmt_victor_compliance_checker
      RetentionInDays: 30

  # ============================================================
  # ECS Cluster for Compliance Checker (Victor)
  # ============================================================
  ComplianceCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: compliance-checker-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  ComplianceTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: compliance-checker-task
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt LambdaExecutionRole.Arn
      TaskRoleArn: !GetAtt LambdaExecutionRole.Arn
      ContainerDefinitions:
        - Name: compliance-checker
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ComplianceCheckerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: SERVICE_NAME
              Value: wealth-mgmt-compliance-checker

Outputs:
  RestApiUrl:
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  WebSocketUrl:
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  FrontendUrl:
    Value: !GetAtt CloudFrontDistribution.DomainName
  ComplianceClusterArn:
    Value: !GetAtt ComplianceCluster.Arn
