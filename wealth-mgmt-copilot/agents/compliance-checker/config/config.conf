# Wealth Management Copilot - Compliance Checker Configuration
# Edit these values to customize your deployment

[AWS]
# AWS Region where resources will be deployed
region =

# AWS Account ID (leave empty for auto-detection)
# account_id =

[Project]
# Project identifier for resource tagging
project_tag = wealth-mgmt

# Environment (dev, stag, prod)
environment = prod

# Component name
component = wealth-mgmt-copilot

[Deployment]
# Use datetime prefix for resource names (true/false)
use_datetime_prefix = false

# Custom prefix (leave empty to use datetime or default)
custom_prefix =

[DynamoDB]
# DynamoDB table names
table_client_profiles = wealth_mgmt_client_profiles
table_transactions = wealth_mgmt_transactions
table_compliance_records = wealth_mgmt_compliance_records
table_audit_log = wealth_mgmt_audit_log
table_user_auth = wealth_mgmt_user_auth

[ComplianceAgent]
# Compliance Checker Agent Configuration
# Project and resource naming
project_name = compliance-checker
cluster_name = compliance-checker-cluster
service_name = compliance-checker-service
ecr_repo_name = compliance-checker
log_group = /ecs/compliance-checker

# Service identification
service_name_full = compliance-checker-agent-fargate
agentcore_log_group = /aws/bedrock-agentcore/runtimes/compliance-checker-agent

# S3 bucket name pattern (will append account_id)
s3_bucket_prefix = compliance-checker-build

# Bedrock model for Compliance Checker agent
compliance_model_id = us.anthropic.claude-sonnet-4-5-20250929-v1:0

[ComplianceRules]
# Maximum single transaction amount before flagging ($)
max_single_transaction = 50000

# Maximum daily transaction volume ($)
max_daily_volume = 250000

# Maximum position concentration (% of portfolio)
max_position_concentration = 25

# KYC renewal period (days)
kyc_renewal_days = 365

# Minimum days between large transactions for pattern detection
pattern_detection_window_days = 7

# AML structuring threshold ($)
aml_structuring_threshold = 10000

# Wash sale lookback period (days)
wash_sale_lookback_days = 30

[Monitoring]
# X-Ray tracing sampling rate (0.0 to 1.0)
xray_sampling_rate = 1.0

# CloudWatch log retention in days
log_retention_days = 7

[Fargate]
# Fargate deployment configuration for Compliance Checker Agent
# This agent uses LangGraph framework deployed on AWS Fargate

# Application name for Fargate deployment
fargate_app_name = fargate-agent-compliance-checker

# Fargate environment
fargate_environment = production

# AWS profile for Fargate deployment (leave empty for environment credentials)
fargate_profile =

# Container port
fargate_port = 18080

# Enable observability (X-Ray, CloudWatch, Application Signals)
fargate_observability_enabled = true
