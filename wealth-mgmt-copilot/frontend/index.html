<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WealthAI Copilot — Login</title>
    <meta name="description" content="AI-powered wealth management platform with intelligent advisors">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

<div class="login-container">
    <div class="logo-area">
        <div class="icon">&#x1F4B0;</div>
        <h1>Wealth<span style="color:var(--gold)">AI</span> Copilot</h1>
        <p class="subtitle">Intelligent Wealth Management Advisors</p>
    </div>

    <div id="error-msg" class="error-msg"></div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="return handleLogin(event)">
        <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn">Sign In</button>
        <p class="toggle-link" onclick="showRegister()">Don't have an account? Register</p>
    </form>

    <!-- Register Form (hidden) -->
    <form id="register-form" class="hidden" onsubmit="return handleRegister(event)">
        <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" placeholder="Jane Smith" required>
        </div>
        <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
            <label for="reg-phone">Phone</label>
            <input type="tel" id="reg-phone" placeholder="+1-555-000-0000">
        </div>
        <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" placeholder="Create password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" id="reg-btn">Create Account</button>
        <p class="toggle-link" onclick="showLogin()">Already have an account? Sign In</p>
    </form>

    <!-- Demo Quick Login -->
    <div style="margin-top:28px; padding-top:20px; border-top:1px solid var(--gray-200);">
        <p style="font-size:0.82rem; color:var(--gray-500); margin-bottom:10px;">Quick Demo Login</p>
        <div style="display:flex; flex-wrap:wrap; gap:6px; justify-content:center;">
            <button class="btn btn-secondary btn-small" onclick="demoLogin('sarah.chen@email.com')">Sarah Chen</button>
            <button class="btn btn-secondary btn-small" onclick="demoLogin('james.wilson@email.com')">James Wilson</button>
            <button class="btn btn-secondary btn-small" onclick="demoLogin('priya.patel@email.com')">Priya Patel</button>
            <button class="btn btn-secondary btn-small" onclick="demoLogin('alex.rodriguez@email.com')">Alex Rodriguez</button>
        </div>
    </div>
</div>

<script src="config.template.js"></script>
<script>
    function showError(msg) {
        const el = document.getElementById('error-msg');
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    function showLogin() {
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('register-form').classList.add('hidden');
        document.getElementById('error-msg').style.display = 'none';
    }

    function showRegister() {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('register-form').classList.remove('hidden');
        document.getElementById('error-msg').style.display = 'none';
    }

    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('login-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Signing in...';

        try {
            const resp = await fetch(`${CONFIG.AUTH_API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error || 'Login failed');

            localStorage.setItem('wm_token', data.token);
            localStorage.setItem('wm_client_id', data.client_id);
            localStorage.setItem('wm_name', data.name);
            localStorage.setItem('wm_email', data.email);
            localStorage.setItem('wm_role', data.role || 'client');
            window.location.href = 'client-dashboard.html';
        } catch (err) {
            showError(err.message);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
        return false;
    }

    async function handleRegister(e) {
        e.preventDefault();
        const btn = document.getElementById('reg-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Creating...';

        try {
            const resp = await fetch(`${CONFIG.AUTH_API_URL}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    full_name: document.getElementById('reg-name').value.trim(),
                    email: document.getElementById('reg-email').value.trim(),
                    phone: document.getElementById('reg-phone').value.trim(),
                    password: document.getElementById('reg-password').value
                })
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error || 'Registration failed');

            showLogin();
            document.getElementById('login-email').value = document.getElementById('reg-email').value;
            showError('Account created! Please sign in.');
            document.getElementById('error-msg').style.background = 'var(--green-light)';
            document.getElementById('error-msg').style.color = 'var(--green)';
        } catch (err) {
            showError(err.message);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Create Account';
        }
        return false;
    }

    function demoLogin(email) {
        document.getElementById('login-email').value = email;
        document.getElementById('login-password').value = 'demo123';

        localStorage.setItem('wm_email', email);
        const demoClients = {
            'sarah.chen@email.com': { id: 'client_sarah_chen', name: 'Sarah Chen' },
            'james.wilson@email.com': { id: 'client_james_wilson', name: 'James Wilson' },
            'priya.patel@email.com': { id: 'client_priya_patel', name: 'Priya Patel' },
            'alex.rodriguez@email.com': { id: 'client_alex_rodriguez', name: 'Alex Rodriguez' }
        };
        const client = demoClients[email];
        if (client) {
            localStorage.setItem('wm_client_id', client.id);
            localStorage.setItem('wm_name', client.name);
            localStorage.setItem('wm_token', 'demo_token_' + Date.now());
            localStorage.setItem('wm_role', 'client');
            window.location.href = 'client-dashboard.html';
        }
    }

    // Redirect if already logged in
    if (localStorage.getItem('wm_token')) {
        window.location.href = 'client-dashboard.html';
    }
</script>
</body>
</html>
