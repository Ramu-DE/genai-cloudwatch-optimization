# GenAI Pet Store - Configuration File
# Edit these values to customize your deployment

[AWS]
# AWS Region where resources will be deployed
region = 

# AWS Account ID (leave empty for auto-detection)
# account_id = 

[Project]
# Project identifier for resource tagging
project_tag = cop413

# Environment (dev, stag, prod)
environment = prod

# Component name
component = genai-petstore

[Deployment]
# Use datetime prefix for resource names (true/false)
use_datetime_prefix = false

# Custom prefix (leave empty to use datetime or default)
custom_prefix = 

[Data]
# Load sample data during deployment (true/false)
load_sample_data = true

# Path to sample data file
sample_data_file = dynamodb_data.json

[Monitoring]
# X-Ray tracing sampling rate (0.0 to 1.0)
xray_sampling_rate = 1.0

# CloudWatch log retention in days
log_retention_days = 7

[Agents]
# Comma-separated list of agents to deploy (bella, oliver, luna, max)
# Leave empty to deploy all agents
agents = bella,oliver,luna,max

# Bedrock model ID for agents
model_id = us.anthropic.claude-haiku-4-5-20251001-v1:0

[Memory]
# Agent memory retention in days
memory_retention_days = 20

[DynamoDB]
# DynamoDB table names
table_customer_profiles = genai_petstore_customer_profiles
table_appointments = genai_petstore_appointments
table_user_auth = genai_petstore_user_auth

[MaxAgent]
# Max Training Agent Configuration
# Project and resource naming
project_name = max-agent
cluster_name = max-agent-cluster
service_name = max-agent-service
ecr_repo_name = max-agent
log_group = /ecs/max-agent

# Service identification
service_name_full = max-training-agent-fargate
agentcore_log_group = /aws/bedrock-agentcore/runtimes/max-training-agent

# S3 bucket name pattern (will append account_id)
s3_bucket_prefix = max-agent-build

# Bedrock model for Max agent
max_model_id = us.anthropic.claude-sonnet-4-5-20250929-v1:0

[Fargate]
# Fargate deployment configuration for Max Training Agent
# This agent uses LangGraph framework deployed on AWS Fargate

# Application name for Fargate deployment
fargate_app_name = fargate-agent-max-training

# Fargate environment
fargate_environment = production

# Fargate deployment region (uses AWS region if not specified)
# fargate_region = us-east-1

# AWS profile for Fargate deployment (leave empty for environment credentials)
fargate_profile = 

# Container port
fargate_port = 18080

# Enable observability (X-Ray, CloudWatch, Application Signals)
fargate_observability_enabled = true
